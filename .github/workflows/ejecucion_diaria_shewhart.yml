name: Ejecucion Diaria Script Shewhart

on:
  schedule:
    # Se ejecuta de lunes a viernes a las 19:12 UTC (21:12 CEST local)
    - cron: '12 19 * * 1-5'
  workflow_dispatch: # Permite ejecutar manualmente

permissions:
  contents: read

jobs:
  run-python:
    runs-on: ubuntu-latest

    # Variables de entorno globales para el proceso
    env:
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASSWORD }}

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Python Script
      run: python main_vYahoo.py
