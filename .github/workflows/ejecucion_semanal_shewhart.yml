name: Resumen Semanal Script Shewhart

on:
  schedule:
    # Se ejecuta SOLO LOS DOMINGOS
    - cron: '00 08 * * 0'
  workflow_dispatch: # Permite ejecutarlo manualmente cuando quieras

jobs:
  run-python-weekly:
    runs-on: ubuntu-latest

    env:
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASSWORD }}

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Weekly Python Script
      run: python main_vYahoo_semanal.py
